{% extends 'resources/base.html' %}

{% block title %}删除确认 - 资料分享站{% endblock %}

{% block content %}
<div class="card" style="max-width:480px; margin:0 auto; text-align:center;">
    <h1 style="margin-top:0;">确认删除？</h1>
    <p>你确定要删除「<strong>{{ resource.title }}</strong>」吗？此操作不可撤销。</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn danger">确认删除</button>
        <a class="btn secondary" href="{% url 'resource-detail' resource.pk %}">取消</a>
    </form>
</div>
{% endblock %}
